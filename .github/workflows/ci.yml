name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:

  # ─── Tests backend ─────────────────────────────────────────────────────────
  backend:
    name: Backend — tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: area-backend/package-lock.json

      - name: Installer les dépendances
        working-directory: area-backend
        run: npm ci

      - name: Lancer les tests Jest
        working-directory: area-backend
        run: npm test

  # ─── Build + lint frontend ─────────────────────────────────────────────────
  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: area-frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: area-frontend
        run: npm ci

      - name: Vérification ESLint
        working-directory: area-frontend
        run: npm run lint

      - name: Build de production
        working-directory: area-frontend
        run: npm run build

  # ─── Validation Docker Compose ─────────────────────────────────────────────
  # Vérifie que docker compose build passe sans erreur sur les trois services.
  docker:
    name: Docker — validation du compose
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Construire toutes les images
        run: docker compose build
