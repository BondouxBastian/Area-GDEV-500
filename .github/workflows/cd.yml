name: CD

# Se déclenche uniquement sur les push vers main, après validation de la CI.
on:
  push:
    branches: [main]

jobs:

  publish:
    name: Publier les images Docker sur GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Connexion au GitHub Container Registry avec le token automatique du workflow
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Buildx permet le cache multi-couches et les builds multi-plateformes si besoin
      - uses: docker/setup-buildx-action@v3

      - name: Publier l'image backend
        uses: docker/build-push-action@v6
        with:
          context: ./area-backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/area-backend:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Publier l'image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./area-frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/area-frontend:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Publier l'image mobile (stub)
        uses: docker/build-push-action@v6
        with:
          context: ./area-mobile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/area-mobile:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max
