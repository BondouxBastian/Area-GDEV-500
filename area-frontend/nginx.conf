server {
    listen 8081;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy vers le backend — le nom "server" est le service docker-compose
    location /api/ {
        proxy_pass         http://server:8080/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # APK Android généré par le service client_mobile (volume partagé)
    location /client.apk {
        alias /apk/client.apk;
    }

    # SPA : toutes les routes inconnues renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
